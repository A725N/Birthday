<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scenee</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family: 'Poppins', sans-serif;
}

/* 🎬 VIDEO */
#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 🌑 OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
}

/* 💬 TEXT (TOP AREA LIKE SEARCH BAR) */
#delayedText{
    position:absolute;
    top:8%; /* 👈 adjust if needed */
    left:50%;
    transform:translateX(-50%) scale(0.9);
    font-size:16px;
    color:#fff;
    opacity:0;
    transition:all 0.4s ease;
    background:rgba(0,0,0,0.4);
    padding:6px 12px;
    border-radius:20px;
    backdrop-filter: blur(6px);
}

/* SHOW */
#delayedText.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
}

/* 🎥 FADE OUT */
.fade-out{
    animation: fadeOut 1s forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
    }
}

</style>
</head>

<body>

<video autoplay muted playsinline id="bgVideo">
    <source src="scene.mp4" type="video/mp4">
</video>

<div class="overlay" id="overlay"></div>

<div id="delayedText">.</div>

<script>

const video = document.getElementById("bgVideo");
const text = document.getElementById("delayedText");

/* ⏱️ SHOW AFTER 4s → HIDE AFTER 1s */
video.addEventListener("play", () => {
    setTimeout(() => {
        text.classList.add("show");

        setTimeout(() => {
            text.classList.remove("show");
        }, 1000); // 👈 visible for 1 second

    }, 4000);
});

/* 🎯 REDIRECT */
video.onended = () => {

    video.classList.add("fade-out");
    document.getElementById("overlay").classList.add("fade-out");

    setTimeout(() => {
        window.location.href = "letter.html";
    }, 1000);
};

</script>

</body>
</html>
